name: Web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and Web export templates
        run: |
          curl -fL 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.64' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl -fL 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=export_templates.tpz&platform=templates' -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q -j /tmp/templates.tpz 'templates/version.txt' 'templates/web*.zip' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Export Web build
        run: |
          make import GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          make export-web GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - uses: actions/deploy-pages@v4
        id: deploy
